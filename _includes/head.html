<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url | escape }}">
<link rel="stylesheet" href="{{ '/assets/accelerate/vendor/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/accelerate/vendor/fontawesome/css/font-awesome.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/accelerate/css/jekyll.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/accelerate/js/site.js' | relative_url }}" defer></script>
